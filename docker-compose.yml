name: nexasupply-ai

x-service-common: &service-common
  restart: unless-stopped
  environment: &common-environment
    SPRING_PROFILES_ACTIVE: local
    DB_URL: jdbc:postgresql://postgres:5432/nexastock
    DB_USER: ${DB_USER:-nexasupply}
    DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    APP_SECURITY_ENABLED: "false"
    INTER_SERVICE_AUTH_MODE: none
    CORS_ALLOWED_ORIGINS: http://localhost:4200
    HTTP_CONNECT_TIMEOUT: 3s
    HTTP_READ_TIMEOUT: 10s
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexastock
      POSTGRES_USER: ${DB_USER:-nexasupply}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./nexasupplyai.sql:/docker-entrypoint-initdb.d/001-nexasupplyai.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexasupply} -d nexastock"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventory-service:
    <<: *service-common
    build: ./inventory-service
    ports: ["8081:8081"]

  order-service:
    <<: *service-common
    build: ./order-service
    environment:
      <<: *common-environment
      INVENTORY_SERVICE_URL: http://inventory-service:8081
    ports: ["8082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      inventory-service: {condition: service_healthy}

  supplier-service:
    <<: *service-common
    build: ./supplier-service
    environment:
      <<: *common-environment
      INVENTORY_SERVICE_URL: http://inventory-service:8081
    ports: ["8083:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      inventory-service: {condition: service_healthy}

  reporting-service:
    <<: *service-common
    build: ./reporting-service
    environment:
      <<: *common-environment
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      SUPPLIER_SERVICE_URL: http://supplier-service:8083
      REPORT_STORAGE_TYPE: local
      REPORT_LOCAL_DIRECTORY: /app/reports
      REPORT_BLOB_CONTAINER: reports
    ports: ["8084:8084"]
    volumes:
      - report-data:/app/reports
    depends_on:
      postgres: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      supplier-service: {condition: service_healthy}

  ai-orchestrator:
    <<: *service-common
    build: ./ai-orchestrator
    environment:
      <<: *common-environment
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      SUPPLIER_SERVICE_URL: http://supplier-service:8083
      REPORTING_SERVICE_URL: http://reporting-service:8084
      FOUNDRY_ENABLED: "false"
      FOUNDRY_MAX_TOOL_ROUNDS: 3
      FOUNDRY_MAX_OUTPUT_TOKENS: 800
      FOUNDRY_MAX_HISTORY_MESSAGES: 12
      FOUNDRY_MAX_HISTORY_CHARACTERS: 24000
    ports: ["8085:8085"]
    depends_on:
      postgres: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      supplier-service: {condition: service_healthy}
      reporting-service: {condition: service_healthy}

volumes:
  postgres-data:
  report-data:
